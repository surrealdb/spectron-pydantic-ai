[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectron-pydantic-ai"
version = "0.1.0"
description = "Spectron agent memory for Pydantic AI: toolset, auto-recall history processor, and persistence helpers."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SurrealDB" }]
keywords = [
    "surrealdb",
    "spectron",
    "pydantic-ai",
    "agent-memory",
    "llm",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai-slim>=2.7",
    "surrealdb>=3.0.0a1",
]

[project.urls]
Homepage = "https://surrealdb.com/platform/spectron"
Repository = "https://github.com/surrealdb-dev/spectron-pydantic-ai"
Issues = "https://github.com/surrealdb-dev/spectron-pydantic-ai/issues"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spectron_pydantic_ai"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["T201"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
